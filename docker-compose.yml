# Windbreak grant application prototype - development stack.
#
#   docker compose up --build
#
#   frontend: http://localhost:8000  (NestJS dev server, hot reload)
#   backend:  http://localhost:5000  (pygeoapi OGC API)
#
# The frontend is a NestJS application: it server-renders the pages with
# Handlebars and talks to the pygeoapi backend server side (PYGEOAPI_URL).
# The backend image (./backend/Dockerfile) extends geopython/pygeoapi:0.21.0
# with flask-cors and a small WSGI patch that decodes transaction bodies
# (see ./backend/windbreak_app.py).

services:
  backend:
    build:
      context: ./backend
    image: windbreak-backend
    container_name: windbreak-backend
    ports:
      # host:container - the pygeoapi image serves gunicorn on port 80
      - "5000:80"
    environment:
      # Patched WSGI app: JSON transaction bodies + pygeoapi with CORS
      WSGI_APP: windbreak_app:APP
      # GeoJSON provider assumes a single process (no write locking)
      WSGI_WORKERS: "1"
      # The windbreak_applications collection is served from PostGIS:
      # WINDBREAK_DATABASE_URL is split into the per-part connection
      # variables the pygeoapi PostgreSQL provider config uses.
      WINDBREAK_DATABASE_URL: "${WINDBREAK_DATABASE_URL:-}"
    volumes:
      - ./backend/pygeoapi.config.yml:/pygeoapi/local.config.yml:ro
      # Read-write: file-backed mock fallback for submitted lines
      # (WINDBREAK_APPLICATIONS_MOCK=true on the frontend) - and the seed
      # farmers/parcels the GeoJSON providers serve.
      - ./backend/data:/pygeoapi/data
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:80/collections/farmers/items?f=json', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      # Repo-root context: the frontend depends on libs/map (file: dep)
      context: .
      dockerfile: frontend/Dockerfile
      target: develop
    image: windbreak-frontend
    container_name: windbreak-frontend
    ports:
      # host:container - the NestJS server listens on port 3000
      - "8000:3000"
    environment:
      # Server-side URL of the pygeoapi backend (service name + internal port)
      PYGEOAPI_URL: http://backend:80
      # Assumed portal-session identity: name + kennitala only
      DEMO_FULL_NAME: "${DEMO_FULL_NAME:-Guðmundur Jónsson}"
      DEMO_KENNITALA: "${DEMO_KENNITALA:-2409693949}"
      # Real clients by default (Phase 2): the Fasteignir-Xroad lookup needs
      # FASTEIGNIR_TOKEN (island.is Bearer JWT); FASTEIGNIR_MOCK=true is the
      # escape hatch for running without one.
      FASTEIGNIR_MOCK: "${FASTEIGNIR_MOCK:-false}"
      FASTEIGNIR_API_URL: "${FASTEIGNIR_API_URL:-}"
      FASTEIGNIR_TOKEN: "${FASTEIGNIR_TOKEN:-}"
      # Existing windbreaks come from the skógrækt PostGIS database
      # (skograekt.skjolbelti, ISN93); submitted applications are persisted
      # in PostGIS (windbreak_applications). WINDBREAK_REGISTRY_MOCK /
      # WINDBREAK_APPLICATIONS_MOCK=true select the prototype mocks.
      WINDBREAK_REGISTRY_MOCK: "${WINDBREAK_REGISTRY_MOCK:-false}"
      WINDBREAK_APPLICATIONS_MOCK: "${WINDBREAK_APPLICATIONS_MOCK:-false}"
      WINDBREAK_DATABASE_URL: "${WINDBREAK_DATABASE_URL:-}"   # or the PG* variables
      PORT: "3000"
    volumes:
      - ./frontend:/workspace/frontend
      - ./libs/map:/workspace/libs/map
      - ./libs/application:/workspace/libs/application
      - frontend_node_modules:/workspace/frontend/node_modules
      - map_node_modules:/workspace/libs/map/node_modules
      - windbreak_node_modules:/workspace/libs/application/templates/windbreak/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  map_node_modules:
  windbreak_node_modules:
